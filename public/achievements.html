<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements Details — Alvy Arnob</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 60px;
      border-bottom: 1px solid rgba(191, 144, 73, 0.2);
    }
    .nav-logo {
      color: #fff;
      font-size: 22px;
      letter-spacing: 4px;
      font-weight: 300;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-logo span { color: #bf9049; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .nav-link {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 1px;
      background: #bf9049;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s ease;
    }
    .nav-link:hover { color: #bf9049; }
    .nav-link:hover::after { transform: scaleX(1); }


    /* ===== MAIN ===== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }
    h1 {
      color: #bf9049;
      font-size: 48px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 400;
      font-family: 'Georgia', serif;
      text-align: center;
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 60px 24px 40px;
      border-top: 1px solid rgba(191, 144, 73, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .footer-name {
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: clamp(64px, 14vw, 220px);
      line-height: 1;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-weight: 400;
      text-align: center;
      opacity: 0;
      transform: translateY(60px) scale(.96);
      transition: opacity .3s ease, transform .3s ease;
      will-change: opacity, transform;
    }
    .footer-name span { color: #bf9049; }
    .footer-links {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 520px;
      gap: 0;
    }
    .footer-link {
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 4px;
      font-family: 'Nunito Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: .18em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(191,144,73,0.25);
      transition: color 0.3s ease;
    }
    .footer-link:first-child { border-top: 1px solid rgba(191,144,73,0.25); }
    .footer-link .fl-arrow {
      color: #bf9049;
      font-size: 18px;
      line-height: 1;
      display: inline-block;
      transition: transform .3s ease, color .3s ease;
    }
    .footer-link:hover { color: #bf9049; }
    .footer-link:hover .fl-arrow { transform: translateX(8px); }
    .footer-divider {
      width: 100%;
      max-width: 200px;
      height: 1px;
      background: rgba(191, 144, 73, 0.3);
    }

    @media (max-width: 720px) {
      .navbar { padding: 20px 24px; }
      .nav-links { gap: 20px; }
      .nav-link { font-size: 11px; letter-spacing: 1px; }
      h1 { font-size: 28px; letter-spacing: 3px; }
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a class="nav-logo" href="alvy-arnob-portfolio.html">ALVY <span>ARNOB</span></a>
    <div class="nav-links">
      <a class="nav-link" href="alvy-arnob-portfolio.html">Works</a>
      <a class="nav-link" href="alvy-arnob-portfolio.html">About Me</a>
      <a class="nav-link" href="alvy-arnob-portfolio.html">Contact</a>
    </div>
  </nav>

  <!-- MAIN -->
  <main>
    <h1>Achievements Details</h1>
  </main>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-name">ALVY <span>ARNOB</span></div>
    <div class="footer-links">
        <a class="footer-link" href="https://www.facebook.com/alviekun" target="_blank" rel="noopener"><span class="fl-label">Facebook</span><span class="fl-arrow">&rarr;</span></a>
        <a class="footer-link" href="https://www.instagram.com/alvie_kun/" target="_blank" rel="noopener"><span class="fl-label">Instagram</span><span class="fl-arrow">&rarr;</span></a>
        <a class="footer-link" href="https://www.linkedin.com/in/alvy-arnob-aa80b4331/" target="_blank" rel="noopener"><span class="fl-label">LinkedIn</span><span class="fl-arrow">&rarr;</span></a>
        <a class="footer-link" href="https://wa.me/8801712967822" target="_blank" rel="noopener"><span class="fl-label">WhatsApp</span><span class="fl-arrow">&rarr;</span></a>
      </div>
    <div class="footer-divider"></div>
  </div>
  <script>
    (function () {
      function updateFooterWordmark() {
        const vh = window.innerHeight;
        document.querySelectorAll('.footer-name').forEach(el => {
          const r = el.getBoundingClientRect();
          const start = vh, end = vh * 0.30;
          let p = (start - r.top) / (start - end);
          p = Math.max(0, Math.min(1, p));
          el.style.opacity = p.toFixed(3);
          el.style.transform = `translateY(${((1 - p) * 60).toFixed(1)}px) scale(${(0.96 + p * 0.04).toFixed(3)})`;
        });
      }
      let tick = false;
      window.addEventListener('scroll', () => {
        if (!tick) { requestAnimationFrame(() => { updateFooterWordmark(); tick = false; }); tick = true; }
      }, { passive: true });
      window.addEventListener('resize', updateFooterWordmark, { passive: true });
      window.addEventListener('load', updateFooterWordmark);
      document.addEventListener('DOMContentLoaded', updateFooterWordmark);
    })();
  </script>
</body>
</html>
