<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements Details — Alvy Arnob</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 60px;
      border-bottom: 1px solid rgba(191, 144, 73, 0.2);
    }
    .nav-logo {
      color: #fff;
      font-size: 22px;
      letter-spacing: 4px;
      font-weight: 300;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-logo span { color: #bf9049; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .nav-link {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 1px;
      background: #bf9049;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s ease;
    }
    .nav-link:hover { color: #bf9049; }
    .nav-link:hover::after { transform: scaleX(1); }


    /* ===== MAIN ===== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }
    h1 {
      color: #bf9049;
      font-size: 48px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 400;
      font-family: 'Georgia', serif;
      text-align: center;
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 40px 60px;
      border-top: 1px solid rgba(191, 144, 73, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .footer-name {
      color: #fff;
      font-size: 18px;
      letter-spacing: 4px;
      font-weight: 300;
    }
    .footer-name span { color: #bf9049; }
    .footer-links {
      display: flex;
      gap: 28px;
    }
    .footer-link {
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      letter-spacing: 1px;
      transition: color 0.2s;
    }
    .footer-link:hover { color: #bf9049; }
    .footer-link svg { width: 16px; height: 16px; }
    .footer-divider {
      width: 100%;
      max-width: 200px;
      height: 1px;
      background: rgba(191, 144, 73, 0.3);
    }

    @media (max-width: 720px) {
      .navbar { padding: 20px 24px; }
      .nav-links { gap: 20px; }
      .nav-link { font-size: 11px; letter-spacing: 1px; }
      h1 { font-size: 28px; letter-spacing: 3px; }
    }
  </style>
</head>

  <!-- FOOTER -->
  <div class="footer">

    <div class="footer-links">
        <a class="footer-link" href="https://www.facebook.com/alviekun" target="_blank" rel="noopener"><span class="fl-label">Facebook</span><span class="fl-arrow">&rarr;</span></a>
